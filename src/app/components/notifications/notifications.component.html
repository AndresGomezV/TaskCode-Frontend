<div class="notification-modal-overlay" (click)="closeModal()"></div>

<div class="notification-modal scrollable-modal" [ngStyle]="{
       top: modalPosition.top + 'px',
       left: (modalPosition.left + 10) + 'px'
     }">
  <h5 class="modal-title">Notifications</h5>

  @if (notifications.length === 0) {
    <p class="no-notifications">You have no new notifications.</p>
  } @else {
    <div class="notification-list">
      @for (notification of notifications; track notification.id) {
        <div class="notification-card" [class.unread]="!notification.isRead">
          <p class="task-title">📌 Task created: {{ notification.taskTitle }}</p>
          <p class="notification-info">
            from <strong>{{ notification.senderUsername }}</strong>
            • {{ notification.time | date:'MMMM d, h:mm a' }}
          </p>
        </div>
      }
    </div>
  }

  <button class="modal-close-btn" (click)="closeModal()">Close</button>
</div>
