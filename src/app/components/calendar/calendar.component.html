<app-sidebar></app-sidebar>
<full-calendar #fullcalendar [options]="calendarOptions"></full-calendar>

<ng-template #taskModal>
  <div class="modal-header">
    <button type="button" class="close" (click)="modalRef?.hide()">&times;</button>
  </div>
  <div class="modal-body">
    <app-task-form  [existingTasks]="allTasks" [selectedDate]="selectedDate" (taskCreated)="loadTasks()"></app-task-form>
  </div>
</ng-template>
