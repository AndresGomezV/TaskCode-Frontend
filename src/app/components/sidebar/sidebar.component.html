      <li>
        <div style="position: relative;">
          <a title="Notifications" class="notification-link">

        <i class="material-icons deep-purple-text text-darken-2">notifications</i>
        @if (unreadCount > 0) {
          <sup class="notification-badge">{{ unreadCount > 99 ? '99+' : unreadCount }}</sup>

      </span>
